services:
  db:
    image: mysql:8.4
    container_name: livraria_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: livraria
      MYSQL_USER: livraria
      MYSQL_PASSWORD: livraria123
      TZ: America/Sao_Paulo
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/livraria.sql:/docker-entrypoint-initdb.d/01-livraria.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./docker
    container_name: livraria_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: livraria
      DB_USER: livraria
      DB_PASS: livraria123
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html

  phpmyadmin:
    image: phpmyadmin:5
    container_name: livraria_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8089:80"

volumes:
  db_data:
